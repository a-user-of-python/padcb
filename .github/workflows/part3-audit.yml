name: Part 3 Audit

# Part 3 evidence gates, all running the app's REAL sources headlessly:
#  - SearchBench: old vs new search semantics over the full bundled
#    corpora — asserts identical result SETS on a fixed query battery
#    and prints before/after timings (exit 1 on any set mismatch).
#  - MatchCensus: symbol<->footprint matching coverage over the whole
#    bundled corpus + the cross-namespace fixture assertions
#    (exit 1 on fixture failure).
#  - BoardFixture: schematic -> table -> board model correspondence
#    proof on a hand-built fixture (exit 1 on any failed assertion).

on:
  workflow_dispatch:
  push:
    paths:
      - "App/PadCB/SExpr.swift"
      - "App/PadCB/KiCadSymbol.swift"
      - "App/PadCB/KiCadFootprint.swift"
      - "App/PadCB/SearchEngine.swift"
      - "App/PadCB/FootprintMatcher.swift"
      - "App/PadCB/FootprintStore.swift"
      - "App/PadCB/PadCBPaths.swift"
      - "App/PadCB/SchematicDocument.swift"
      - "App/PadCB/SymbolDrawList.swift"
      - "App/PadCB/ConnectionTable.swift"
      - "App/PadCB/PCBBoardModel.swift"
      - "tools/SearchBench/**"
      - "tools/search_fixtures.py"
      - "tools/MatchCensus/**"
      - "tools/match-fixtures/**"
      - "tools/BoardFixture/**"
      - "tools/board-fixtures/**"
      - "tools/FootprintCensus/**"
      - "tools/merge_symdirs.py"
      - ".github/workflows/part3-audit.yml"

env:
  KICAD_SYMBOLS_URL: "https://gitlab.com/kicad/libraries/kicad-symbols/-/archive/10.0.1/kicad-symbols-10.0.1.tar.gz"
  KICAD_FOOTPRINTS_URL: "https://gitlab.com/kicad/libraries/kicad-footprints/-/archive/10.0.1/kicad-footprints-10.0.1.tar.gz"
  KICAD_FOOTPRINTS_SHA256: "858754aa9946f62c9df2ee2368e6ece0a6983167a10d406767bbaddb0c89bb4f"

jobs:
  part3-audit:
    name: Search bench + match census + board fixture
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download KiCad symbol libraries (pinned) and merge symdirs
        run: |
          curl -fL "$KICAD_SYMBOLS_URL" -o /tmp/kicad-symbols.tar.gz
          mkdir -p /tmp/kicad-symbols
          tar -xzf /tmp/kicad-symbols.tar.gz -C /tmp/kicad-symbols --strip-components=1
          python3 tools/merge_symdirs.py /tmp/kicad-symbols App/PadCB/Symbols | tail -2

      - name: Download KiCad footprint libraries (pinned) + census + index
        run: |
          curl -fL "$KICAD_FOOTPRINTS_URL" -o /tmp/kicad-footprints.tar.gz
          echo "$KICAD_FOOTPRINTS_SHA256  /tmp/kicad-footprints.tar.gz" | shasum -a 256 -c -
          mkdir -p /tmp/kicad-footprints
          tar -xzf /tmp/kicad-footprints.tar.gz -C /tmp/kicad-footprints --strip-components=1
          for d in /tmp/kicad-footprints/*.pretty; do
            cp -R "$d" App/PadCB/Footprints/
          done
          cp /tmp/kicad-footprints/LICENSE.md App/PadCB/Footprints/KICAD-FOOTPRINTS-LICENSE.md
          xcrun swiftc -O -o /tmp/FootprintCensus \
            App/PadCB/SExpr.swift \
            App/PadCB/KiCadFootprint.swift \
            tools/FootprintCensus/main.swift
          /tmp/FootprintCensus App/PadCB/Footprints App/PadCB/Footprints/FootprintIndex.json | tee /tmp/footprint-census.txt
          test -s App/PadCB/Footprints/FootprintIndex.json

      - name: SearchBench (old vs new semantics, full corpora)
        run: |
          python3 tools/search_fixtures.py \
            --symbols-dir App/PadCB/Symbols \
            --footprint-index App/PadCB/Footprints/FootprintIndex.json \
            --out-dir /tmp/searchbench
          xcrun swiftc -O -o /tmp/SearchBench \
            App/PadCB/SearchEngine.swift \
            tools/SearchBench/main.swift
          /tmp/SearchBench /tmp/searchbench/symbols.json /tmp/searchbench/footprints.json | tee /tmp/search-bench.txt

      - name: MatchCensus (bundled-corpus coverage + cross-namespace fixtures)
        run: |
          xcrun swiftc -O -o /tmp/MatchCensus \
            App/PadCB/SExpr.swift \
            App/PadCB/KiCadSymbol.swift \
            App/PadCB/KiCadFootprint.swift \
            App/PadCB/FootprintStore.swift \
            App/PadCB/FootprintMatcher.swift \
            App/PadCB/PadCBPaths.swift \
            tools/MatchCensus/main.swift
          /tmp/MatchCensus App/PadCB/Symbols App/PadCB/Footprints \
            tools/match-fixtures/bundled-symbols \
            tools/match-fixtures/bundled-footprints \
            tools/match-fixtures/custom-symbols \
            tools/match-fixtures/custom-footprints | tee /tmp/match-census.txt

      - name: BoardFixture (schematic -> table -> board model proof)
        run: |
          xcrun swiftc -O -o /tmp/BoardFixture \
            App/PadCB/SExpr.swift \
            App/PadCB/KiCadSymbol.swift \
            App/PadCB/KiCadFootprint.swift \
            App/PadCB/SchematicDocument.swift \
            App/PadCB/SymbolDrawList.swift \
            App/PadCB/ConnectionTable.swift \
            App/PadCB/FootprintStore.swift \
            App/PadCB/FootprintMatcher.swift \
            App/PadCB/PadCBPaths.swift \
            App/PadCB/PCBBoardModel.swift \
            tools/BoardFixture/main.swift
          /tmp/BoardFixture tools/board-fixtures | tee /tmp/board-fixture.txt
